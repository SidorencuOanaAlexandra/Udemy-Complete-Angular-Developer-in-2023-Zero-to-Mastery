<!-- Main Content -->
<section class="container mx-auto my-8 bg-secondary p-6">
    <div class="rounded relative flex flex-col">
        <div class="font-bold mb-6">Upload Video</div>
        <app-alert *ngIf="showAlert" [color]="alertColor">
            <p>{{ alertMsg }}</p>
            <p *ngIf="showPercentage">{{ percentage | percent }}</p>
        </app-alert>

        <ng-container>
            <span *ngIf="!ffmpegService.isReady; else uploadFormData" class="material-icon text-center text-6x1 p-8 animate-spin">
                settings
            </span>
        </ng-container>
        
        <ng-template #uploadFormData>
                    <!-- Upload Dropbox -->
            <ng-container *ngIf="!formIsVisible; else uploadFormCtr">
                <div app-event-blocker (dragend)="isDragover = false"
                    (dragover)="isDragover = true" (dragenter)="isDragover = true" (dragleave)="isDragover = false"
                    (mouseleave)="isDragover = false" (drop)="storeFile($event)" [ngClass]="{
                        'bg-indigo-400 border-indigo-400 border-solid': isDragover
                    }" class="w-full px-10 py-40 rounded text-center cursor-pointer border border-dashed
                    border-gray-400 transition duration-500 hover:text-white
                    hover:bg-indigo-400 hover:border-indigo-400 hover:border-solid text-xl">
                    <h5>Drop your file here (mp4 only!)</h5>
                    <span *ngIf="ffmpegService.isrunning" class="material-icon text-center text-6x1 p-8 animate-spin">
                        autorenew
                    </span>
                </div>
                <input type="file" class="mt-4" (change)="storeFile($event)">
            </ng-container>

            <!-- Video Editor -->
            <ng-template #uploadFormCtr>
                <!-- Form -->
                <form [formGroup]="uploadForm" (ngSubmit)="uploadFile()">
                    <!-- Screenshots -->
                    <h2 class="mb-4 text-xl">Select a Thumbnail</h2>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
                        <div *ngFor="let screenshot of screenshots" class="border-8 cursor-pointer border-green-400">
                            <img [src]="screenshot | safeURL">
                        </div>
                    </div>

                    <!-- Title -->
                    <div class="mt-4">
                        <label class="block text-xl mb-4">Title</label>
                        <app-input [control]="title" placeholder="Enter Title"></app-input>
                    </div>

                    <div class="mt-4 text-right">
                        <button [disabled]="uploadForm.invalid || isSubmission" type="submit" class="block w-full bg-indigo-400 text-white py-1.5 px-3 rounded transition
                        hover:bg-indigo-500 disabled:opacity-50 disabled:bg-indigo-400">
                            Publish
                        </button>
                    </div>
                </form>
            </ng-template>
        </ng-template>
        

    </div>
</section>
